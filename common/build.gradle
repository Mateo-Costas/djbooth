architectury {
    common rootProject.enabled_platforms.split(",")
}

dependencies {
    // Loom needs a mod loader on the compile classpath for common; use the Fabric loader.
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    modImplementation "dev.architectury:architectury:${rootProject.architectury_api_version}"

    // Audio backend API for the DSP/player code (compileOnly, never bundled). Pulled from the
    // Modrinth maven so CI can compile without the local jar. The DMX code links no MineDMX
    // classes (pure UDP), so MineDMX is only a runtime soft-dep, not needed to compile.
    compileOnly "maven.modrinth:watermedia:3.0.0.21"

    testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
    useJUnitPlatform()
}
