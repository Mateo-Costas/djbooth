architectury {
    common rootProject.enabled_platforms.split(",")
}

dependencies {
    // Loom needs a mod loader on the compile classpath for common; use the Fabric loader.
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    modImplementation "dev.architectury:architectury:${rootProject.architectury_api_version}"

    // Soft-dep libraries used by the client audio / DMX code (pure Java, compileOnly, never bundled).
    compileOnly rootProject.files("libs/watermedia-3.0.0.21.jar")
    compileOnly rootProject.files("libs/minedmx-1.5.1.jar")

    testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
    useJUnitPlatform()
}
